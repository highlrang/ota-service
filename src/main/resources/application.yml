spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ota_service
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ota-service-demo-secret-key-for-jwt-signing
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 604800

app:
  upload:
    base-dir: ${java.io.tmpdir}/ota_service/uploads
